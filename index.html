<!doctype html>
<html lang="es-CR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="description" content="Finanzas personales en colones costarricenses" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Finanzas</title>
    <script>
      // Aplica el tema guardado ANTES del primer pintado, para evitar el
      // flash de tema incorrecto (FOUC) al cargar. Debe ser síncrono e
      // inline — un script externo llegaría demasiado tarde.
      (function () {
        try {
          var stored = localStorage.getItem('finanzas-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (_e) {
          // localStorage inaccesible (modo privado estricto): queda en "system".
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
