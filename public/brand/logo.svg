<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" fill="none">
  <defs>
    <path id="arcpath" d="M 42 96 A 38 38 0 0 1 118 96" />
  </defs>

  <!-- Medallón: moneda de "ni un cinco" -->
  <g stroke="#0e3b36" stroke-linecap="round">
    <!-- borde estriado -->
    <g stroke-width="2.5">
      <circle cx="80" cy="80" r="64" />
    </g>
    <g stroke-width="2">
      <circle cx="80" cy="80" r="54" />
    </g>

    <!-- laurel izquierda -->
    <g fill="#0e3b36" stroke="none">
      <ellipse cx="34" cy="108" rx="7" ry="3.4" transform="rotate(-20 34 108)" />
      <ellipse cx="29" cy="97" rx="7.5" ry="3.4" transform="rotate(-42 29 97)" />
      <ellipse cx="27" cy="84" rx="8" ry="3.4" transform="rotate(-66 27 84)" />
      <ellipse cx="29" cy="71" rx="7.5" ry="3.2" transform="rotate(-96 29 71)" />
      <ellipse cx="34" cy="60" rx="6.5" ry="3" transform="rotate(-122 34 60)" />
      <path d="M 24 114 Q 18 90 24 56" stroke="#0e3b36" stroke-width="2" fill="none" />
    </g>
    <!-- laurel derecha (espejo) -->
    <g fill="#0e3b36" stroke="none">
      <ellipse cx="126" cy="108" rx="7" ry="3.4" transform="rotate(20 126 108)" />
      <ellipse cx="131" cy="97" rx="7.5" ry="3.4" transform="rotate(42 131 97)" />
      <ellipse cx="133" cy="84" rx="8" ry="3.4" transform="rotate(66 133 84)" />
      <ellipse cx="131" cy="71" rx="7.5" ry="3.2" transform="rotate(96 131 71)" />
      <ellipse cx="126" cy="60" rx="6.5" ry="3" transform="rotate(122 126 60)" />
      <path d="M 136 114 Q 142 90 136 56" stroke="#0e3b36" stroke-width="2" fill="none" />
    </g>
  </g>

  <!-- numeral 5, tachado: "ni un cinco" -->
  <g fill="none" stroke="#0e3b36">
    <text x="80" y="76" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="46" font-weight="700" fill="#0e3b36" stroke="none">5</text>
    <line x1="58" y1="84" x2="102" y2="52" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- leyenda inferior en arco -->
  <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700"
    fill="#0e3b36" letter-spacing="2.5">
    <textPath href="#arcpath" startOffset="50%" text-anchor="middle">NI UN CINCO</textPath>
  </text>

  <!-- wordmark -->
  <text x="172" y="100" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="58" font-weight="800" fill="#0e3b36" letter-spacing="-1.5">NiUnCinco</text>
</svg>
